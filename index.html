<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fix · location capture</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="console">
    <header class="masthead">
      <span class="wordmark">FIX</span>
      <span class="eyebrow">positioning demo</span>
      <a class="results-link" href="results.html">captures &rsaquo;</a>
    </header>

    <section class="panel">
      <!-- Signature element: the reticle. Idle = searching, locked = solid. -->
      <div class="reticle" id="reticle" data-state="idle" aria-hidden="true">
        <div class="ring ring-outer"></div>
        <div class="ring ring-search"></div>
        <div class="cross cross-v"></div>
        <div class="cross cross-h"></div>
        <div class="dot"></div>
      </div>

      <div class="readout">
        <p class="lede">Getting your exact position needs your say-so.</p>
        <p class="body">
          When you tap below, your browser asks whether to share your location.
          Allow it and this reads GPS-level coordinates. Decline and it falls back
          to an approximate fix from your network address.
        </p>

        <button id="shareBtn" class="cta">Share my location</button>

        <dl class="coords" id="coords" hidden>
          <div class="coord-row">
            <dt>lat</dt><dd id="outLat">—</dd>
          </div>
          <div class="coord-row">
            <dt>lng</dt><dd id="outLng">—</dd>
          </div>
          <div class="coord-row">
            <dt>±</dt><dd id="outAcc">—</dd>
          </div>
        </dl>

        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section class="map-wrap" id="mapWrap" hidden>
      <div id="map"></div>
      <div class="source-tag" id="sourceTag"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
