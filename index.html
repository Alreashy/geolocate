<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marquee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <span class="wordmark">MARQUEE</span>
  </header>

  <!-- Consent gate: ask before anything happens -->
  <section id="gate" class="gate">
    <div class="gate-card">
      <h1 class="gate-title">See what's popular in your area</h1>
      <p class="gate-sub">
        Allow location and we'll show the movies people in your region are watching
        most right now. It's used only to find your area — nothing is saved.
      </p>
      <button id="consentBtn" class="btn-red">Show me what's popular</button>
      <p id="gateStatus" class="gate-status" role="status" aria-live="polite"></p>
    </div>
  </section>

  <!-- Content, revealed only after the visitor allows -->
  <main id="content" hidden>
    <section class="hero" id="hero">
      <div class="hero-overlay"></div>
      <div class="hero-inner">
        <span class="hero-tag" id="heroTag"></span>
        <h2 class="hero-title" id="heroTitle"></h2>
        <p class="hero-blurb" id="heroBlurb"></p>
      </div>
    </section>
    <div class="rows" id="rows"></div>
    <p class="fineprint" id="note"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
